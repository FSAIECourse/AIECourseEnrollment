name: Provision Student Repositories

on:
  issues:
    types: [labeled]

concurrency:
  group: aie-enrollment
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  provision:
    if: github.event.label.name == 'provision-repo'
    runs-on: ubuntu-latest

    env:
      ORG_NAME: FSAIECourse

    steps:
      - name: Checkout Enrollment Repository
        uses: actions/checkout@v4

      - name: Generate GitHub App Token
        id: app_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ env.ORG_NAME }}

      - name: Parse Issue and Validate Passcode
        id: auth
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          STUDENT_GITHUB_LOGIN: ${{ github.event.issue.user.login }}
        run: |
          set -e

          if [ ! -f pg2Info.txt ]; then
            echo "ERROR: pg2Info.txt was not found in the repository root."
            exit 1
          fi

          PREFIX=$(grep -m 1 -E '^[[:space:]]*#[[:space:]]*PREFIX:' pg2Info.txt | sed -E 's/^[[:space:]]*#[[:space:]]*PREFIX:[[:space:]]*//' | tr -d '\r' || true)
          EXPECTED_HASH=$(grep -m 1 -E '^[[:space:]]*#[[:space:]]*MONTHLY_CODE:' pg2Info.txt | sed -E 's/^[[:space:]]*#[[:space:]]*MONTHLY_CODE:[[:space:]]*//' | tr -d '\r' || true)
          MAX_REPOS=$(grep -m 1 -E '^[[:space:]]*#[[:space:]]*MAX_REPOS:' pg2Info.txt | sed -E 's/^[[:space:]]*#[[:space:]]*MAX_REPOS:[[:space:]]*//' | tr -d '\r' || true)

          if [ -z "$PREFIX" ] || [ -z "$EXPECTED_HASH" ] || ! [[ "$MAX_REPOS" =~ ^[0-9]+$ ]]; then
            echo "ERROR: pg2Info.txt must define PREFIX, MONTHLY_CODE, and a numeric MAX_REPOS."
            exit 1
          fi

          PASSCODE=$(printf '%s\n' "$ISSUE_BODY" | grep -A 2 -i "Claim Code" | tail -n 1 | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' || true)
          if [ -z "$PASSCODE" ]; then
            PASSCODE=$(printf '%s\n' "$ISSUE_BODY" | grep -A 2 -i "Passcode" | tail -n 1 | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' || true)
          fi

          if [ -z "$PASSCODE" ]; then
            echo "ERROR: Claim code missing from issue."
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "@${STUDENT_GITHUB_LOGIN} Error: Claim code was not provided."
            gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason "not planned"
            echo "AUTH_FAILED=true" >> "$GITHUB_ENV"
            exit 0
          fi

          PASSCODE_HASH=$(printf '%s' "$PASSCODE" | sha256sum | awk '{print $1}')
          if [ "$PASSCODE_HASH" != "$EXPECTED_HASH" ]; then
            echo "ERROR: Invalid passcode."
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "@${STUDENT_GITHUB_LOGIN} Error: Invalid enrollment claim code."
            gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason "not planned"
            echo "AUTH_FAILED=true" >> "$GITHUB_ENV"
            exit 0
          fi

          CURRENT_COUNT=$(gh repo list "$ORG_NAME" --limit 1000 --json name --jq '.[].name' | awk -v prefix="aie-${PREFIX}-" 'index($0, prefix) == 1 { count++ } END { print count + 0 }')
          if [ "$CURRENT_COUNT" -ge "$MAX_REPOS" ]; then
            echo "ERROR: Maximum cohort repository limit reached."
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "@${STUDENT_GITHUB_LOGIN} Error: Course repository capacity reached. Please contact your instructor."
            gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason "not planned"
            echo "AUTH_FAILED=true" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "PREFIX=${PREFIX}" >> "$GITHUB_ENV"
          echo "AUTH_FAILED=false" >> "$GITHUB_ENV"

      - name: Provision Course Repositories
        if: env.AUTH_FAILED == 'false'
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          ORG: ${{ env.ORG_NAME }}
          PREFIX: ${{ env.PREFIX }}
          STUDENT_GITHUB_LOGIN: ${{ github.event.issue.user.login }}
        run: |
          set -e
          SUMMARY=""

          LABS="Artificial_Intelligence_Ecosystem"
          for N in $LABS; do
            TEMPLATE_REPO="$N"
            NEW_REPO_NAME="aie-${PREFIX}-${STUDENT_GITHUB_LOGIN}"

            if gh repo view "$ORG/$NEW_REPO_NAME" > /dev/null 2>&1; then
              echo "::warning::Repository $ORG/$NEW_REPO_NAME already exists. Skipping."
              SUMMARY="${SUMMARY}- https://github.com/${ORG}/${NEW_REPO_NAME} (already existed)\n"
              continue
            fi

            echo "Creating private repository $NEW_REPO_NAME from template $TEMPLATE_REPO..."
            gh api \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              "/repos/$ORG/$TEMPLATE_REPO/generate" \
              -f owner="$ORG" \
              -f name="$NEW_REPO_NAME" \
              -F private=true

            for i in $(seq 1 15); do
              BRANCH_CHECK=$(gh api "/repos/$ORG/$NEW_REPO_NAME/branches" --jq '.[].name' 2>/dev/null || true)
              if [ -n "$BRANCH_CHECK" ]; then
                break
              fi
              echo "Template copy in progress... waiting 3 seconds (attempt $i/15)"
              sleep 3
            done
            sleep 5

            echo "Adding student $STUDENT_GITHUB_LOGIN as a collaborator..."
            gh api \
              --method PUT \
              -H "Accept: application/vnd.github+json" \
              "/repos/$ORG/$NEW_REPO_NAME/collaborators/$STUDENT_GITHUB_LOGIN" \
              -f permission=write


            SUMMARY="${SUMMARY}- https://github.com/${ORG}/${NEW_REPO_NAME}\n"
          done

          {
            echo 'PROVISION_SUMMARY<<EOF'
            printf '%b' "$SUMMARY"
            echo 'EOF'
          } >> "$GITHUB_ENV"

      - name: Close Issue and Reply to Student
        if: env.AUTH_FAILED == 'false'
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          STUDENT_GITHUB_LOGIN: ${{ github.event.issue.user.login }}
        run: |
          gh issue comment "$ISSUE_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --body "@${STUDENT_GITHUB_LOGIN}, your private course repositories have been created:

          ${PROVISION_SUMMARY}

          **ACTION REQUIRED**: You will receive an invitation for each repository. Accept each invitation within **7 days** to gain access."

          gh issue close "$ISSUE_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --reason "completed"
